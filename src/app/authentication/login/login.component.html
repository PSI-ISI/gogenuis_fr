<!-- Login Component - Simplified -->
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <img src="../../assets/img/logo.png" alt="Gogenius" class="logo-img">
      </div>
      <p>Connectez-vous à votre compte</p>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <!-- Login Field -->
      <div class="form-group">
        <label for="login">Nom d'utilisateur</label>
        <input 
          type="text" 
          id="login"
          class="form-control"
          formControlName="login" 
          placeholder="Entrez votre nom d'utilisateur">
        <div class="error-message" *ngIf="loginForm.get('login')?.touched && loginForm.get('login')?.hasError('required')">
          Le nom d'utilisateur est requis
        </div>
      </div>
      
      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password"
          class="form-control"
          formControlName="password" 
          placeholder="Entrez votre mot de passe">
        <div class="error-message" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
          Le mot de passe est requis
        </div>
      </div>
      
      <!-- Error Message -->
      <div class="alert alert-danger" *ngIf="loginFailed">
        Nom d'utilisateur ou mot de passe incorrect.
      </div>
      
      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        <span *ngIf="isLoading">Connexion...</span>
        <span *ngIf="!isLoading">Se connecter</span>
      </button>
      
      <!-- Register Link -->
      <p class="register-link">
        Pas encore de compte ? <a routerLink="/auth/register">S'inscrire</a>
      </p>
    </form>
  </div>
</div>
